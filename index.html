<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Soccer 2026 - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
        }
        canvas {
            display: block;
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.92);
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .char-card {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .char-card:hover, .char-card.selected {
            border-color: #38bdf8;
            background: #334155;
            transform: scale(1.05);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Bosh sahifa (Splash Screen) -->
        <div id="main-menu" class="screen">
            <h1>NINJA SOCCER 2026</h1>
            <button class="btn" onclick="showModeSelect()">O'yinni Boshlash</button>
        </div>

        <!-- Rejim tanlash -->
        <div id="mode-select" class="screen hidden">
            <h1>Rejimni Tanlang</h1>
            <button class="btn" onclick="selectMode('bot')">1 Kishi (VS Bot)</button>
            <button class="btn" onclick="selectMode('2p')">2 Kishilik (Local)</button>
            <button class="btn" onclick="backToMenu()" style="background: #475569;">Orqaga</button>
        </div>

        <!-- Qahramon tanlash -->
        <div id="char-select" class="screen hidden">
            <h1 id="char-title">1-O'yinchi: Qahramon Tanlang</h1>
            <div class="char-grid" id="char-grid"></div>
        </div>

        <!-- O'yin interfeysi (HUD) -->
        <div id="hud" class="hidden">
            <div id="score-1" style="color: #38bdf8;">0</div>
            <div id="timer" style="color: #e2e8f0;">03:00</div>
            <div id="score-2" style="color: #f43f5e;">0</div>
        </div>

        <!-- Asosiy Canvas maydoni -->
        <canvas id="gameCanvas" width="800" height="450" class="hidden"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'MENU';
        let gameMode = 'bot';
        let p1Selection = null;
        let p2Selection = null;
        let selectingPlayer = 1;

        const characters = [
            { name: 'Naruto', color: '#f97316', jutsu: 'Rasengan' },
            { name: 'Sasuke', color: '#6366f1', jutsu: 'Chidori' },
            { name: 'Kakashi', color: '#94a3b8', jutsu: 'Lightning Blade' },
            { name: 'Madara', color: '#ef4444', jutsu: 'Susanoo' },
            { name: 'Itachi', color: '#dc2626', jutsu: 'Amaterasu' },
            { name: 'Hashirama', color: '#10b981', jutsu: 'Wood Golem' },
            { name: 'Minato', color: '#eab308', jutsu: 'Flying Raijin' },
            { name: 'Pain', color: '#8b5cf6', jutsu: 'Almighty Push' },
            { name: 'Obito', color: '#334155', jutsu: 'Kamui' },
            { name: 'Might Guy', color: '#16a34a', jutsu: 'Night Guy' }
        ];

        let p1 = { x: 100, y: 320, vx: 0, vy: 0, width: 40, height: 70, color: '#f97316', score: 0, grounded: false };
        let p2 = { x: 660, y: 320, vx: 0, vy: 0, width: 40, height: 70, color: '#6366f1', score: 0, grounded: false };
        let ball = { x: 400, y: 200, vx: 0, vy: 0, radius: 12 };

        let keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function showModeSelect() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('mode-select').classList.remove('hidden');
        }

        function backToMenu() {
            document.getElementById('mode-select').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function selectMode(mode) {
            gameMode = mode;
            document.getElementById('mode-select').classList.add('hidden');
            document.getElementById('char-select').classList.remove('hidden');
            buildCharGrid();
        }

        function buildCharGrid() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            characters.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerHTML = `<b style="color:${char.color}">${char.name}</b><br><small>${char.jutsu}</small>`;
                card.onclick = () => chooseCharacter(index);
                grid.appendChild(card);
            });
        }

        function chooseCharacter(index) {
            if (selectingPlayer === 1) {
                p1Selection = characters[index];
                p1.color = p1Selection.color;
                selectingPlayer = 2;
                if (gameMode === 'bot') {
                    // Bot tasodifiy tanlaydi
                    let botIndex = Math.floor(Math.random() * characters.length);
                    p2Selection = characters[botIndex];
                    p2.color = p2Selection.color;
                    startGame();
                } else {
                    document.getElementById('char-titleinnerText') = "2-O'yinchi: Qahramon Tanlang";
                }
            } else {
                p2Selection = characters[index];
                p2.color = p2Selection.color;
                startGame();
            }
        }

        function startGame() {
            document.getElementById('char-select').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('gameCanvas').classList.remove('hidden');
            gameState = 'PLAYING';
            resetPositions();
            requestAnimationFrame(gameLoop);
        }

        function resetPositions() {
            p1.x = 150; p1.y = 320; p1.vx = 0; p1.vy = 0;
            p2.x = 610; p2.y = 320; p2.vx = 0; p2.vy = 0;
            ball.x = 400; ball.y = 200; ball.vx = 0; ball.vy = 0;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // 1-O'yinchi boshqaruvi (W, A, D)
            if (keys['KeyA']) p1.vx = -5;
            else if (keys['KeyD']) p1.vx = 5;
            else p1.vx = 0;

            if (keys['KeyW'] && p1.grounded) {
                p1.vy = -12;
                p1.grounded = false;
            }

            // 2-O'yinchi yoki Bot boshqaruvi
            if (gameMode === '2p') {
                if (keys['ArrowLeft']) p2.vx = -5;
                else if (keys['ArrowRight']) p2.vx = 5;
                else p2.vx = 0;

                if (keys['ArrowUp'] && p2.grounded) {
                    p2.vy = -12;
                    p2.grounded = false;
                }
            } else {
                // Oddiy Bot mantiqi
                if (ball.x > p2.x + 20) p2.vx = 3.5;
                else if (ball.x < p2.x - 20) p2.vx = -3.5;
                else p2.vx = 0;

                if (ball.y < p2.y && p2.grounded && Math.random() < 0.05) {
                    p2.vy = -12;
                    p2.grounded = false;
                }
            }

            // Gravitatsiya va fizika
            p1.vy += 0.5;
            p2.vy += 0.5;

            p1.x += p1.vx; p1.y += p1.vy;
            p2.x += p2.vx; p2.y += p2.vy;

            // Yer bilan to'qnashuv
            if (p1.y > 320) { p1.y = 320; p1.vy = 0; p1.grounded = true; }
            if (p2.y > 320) { p2.y = 320; p2.vy = 0; p2.grounded = true; }

            // Chegaralar
            if (p1.x < 20) p1.x = 20;
            if (p1.x > 360) p1.x = 360;
            if (p2.x < 400) p2.x = 400;
            if (p2.x > 740) p2.x = 740;

            // To'p fizikasi
            ball.vy += 0.35;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // To'p devorlar bilan
            if (ball.y > 390) { ball.y = 390; ball.vy *= -0.75; ball.vx *= 0.95; }
            if (ball.x < 15) { ball.x = 15; ball.vx *= -0.8; }
            if (ball.x > 785) { ball.x = 785; ball.vx *= -0.8; }

            // Gol urilishini tekshirish
            if (ball.y > 250 && ball.x < 50) {
                document.getElementById('score-2').innerText = ++p2.score;
                resetPositions();
            } else if (ball.y > 250 && ball.x > 750) {
                document.getElementById('score-1').innerText = ++p1.score;
                resetPositions();
            }

            // O'yinchi va To'p to'qnashuvi
            checkPlayerBallCollision(p1);
            checkPlayerBallCollision(p2);
        }

        function checkPlayerBallCollision(p) {
            let dx = ball.x - (p.x + p.width / 2);
            let dy = ball.y - (p.y + p.height / 2);
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.radius + p.width / 2) {
                ball.vx = dx * 0.3 + p.vx * 0.5;
                ball.vy = dy * 0.3 + p.vy * 0.5;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Maydon chiziqlari va darvozalar
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 200, 60, 200); // Chap darvoza
            ctx.strokeRect(720, 200, 60, 200); // O'ng darvoza

            // Markaziy chiziq
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // 1-O'yinchi
            ctx.fillStyle = p1.color;
            ctx.fillRect(p1.x, p1.y, p1.width, p1.height);

            // 2-O'yinchi
            ctx.fillStyle = p2.color;
            ctx.fillRect(p2.x, p2.y, p2.width, p2.height);

            // To'p
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
